name: Bug report
description: Report a reproducible Mosaic problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not attach credentials, db.json, private logs, or screenshots containing your desktop."
  - type: input
    id: version
    attributes:
      label: Mosaic version
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a minimal, sanitized example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal paths, user data, desktop background, and conversation history.
          required: true
