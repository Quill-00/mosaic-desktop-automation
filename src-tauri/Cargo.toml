[package]
name = "mosaic"
version = "0.3.1"
description = "Local-first desktop automation dashboard for scripts and plugins"
authors = ["Mosaic contributors"]
license = "MIT"
repository = "https://github.com/Quill-00/mosaic-desktop-automation"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mosaic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
notify = "6"
regex = "1"
ureq = { version = "2", features = ["json"] }
keyring = "3"
sha2 = "0.10"
url = "2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tungstenite = { version = "0.26", features = ["native-tls"] }
base64 = "0.22"
ring = "0.17"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = "symbols"
